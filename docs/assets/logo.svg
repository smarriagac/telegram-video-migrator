<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="50%" stop-color="#0E1019" />
      <stop offset="100%" stop-color="#07080D" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Main Cyan to Emerald Gradient -->
    <linearGradient id="cyanEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Secondary Soft Emerald Gradient -->
    <linearGradient id="emeraldSoftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Dynamic Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Light Reflection in Corner -->
  <circle cx="100" cy="100" r="140" fill="#06B6D4" opacity="0.06" filter="blur(40px)" />
  <circle cx="412" cy="412" r="140" fill="#10B981" opacity="0.06" filter="blur(40px)" />

  <!-- Outer Orbit Stream Arcs (Signifying MTProto Video Migration Pipeline) -->
  <path d="M 120 220 A 150 150 0 0 1 360 140" fill="none" stroke="url(#cyanEmeraldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4" stroke-dasharray="12 16" />
  <path d="M 392 292 A 150 150 0 0 1 152 372" fill="none" stroke="url(#cyanEmeraldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4" stroke-dasharray="12 16" />

  <!-- Geometric Emblem: Telegram Plane merged with Video Play Chevron -->
  <g transform="translate(4, -2)">
    <!-- Right Wing / Video Forward Momentum (Glow layer) -->
    <path d="M 148 240 L 372 136 C 384 130 394 142 388 154 L 320 348 C 314 362 296 366 286 352 L 236 292 L 148 240 Z"
          fill="url(#cyanEmeraldGrad)"
          filter="url(#subtleGlow)" />

    <!-- Telegram Center Fold (Depth layer) -->
    <path d="M 236 292 L 388 154 L 272 254 L 236 292 Z"
          fill="#083344"
          opacity="0.65" />

    <!-- Lower Wing / Directional Kick -->
    <path d="M 236 292 L 272 378 C 278 392 296 392 300 376 L 314 330 L 236 292 Z"
          fill="url(#emeraldSoftGrad)"
          opacity="0.9" />

    <!-- Embedded Video Play Glyph in Negative Space / Accent -->
    <polygon points="208,216 208,268 252,242" fill="#FFFFFF" opacity="0.92" filter="url(#subtleGlow)" />

    <!-- Leading High-Speed Particle Nodes -->
    <circle cx="388" cy="148" r="7" fill="#67E8F9" filter="url(#subtleGlow)" />
    <circle cx="320" cy="348" r="5" fill="#34D399" />
  </g>
</svg>
